scrape_configs:
  - job_name: 'kong'
    metrics_path: /metrics
    scheme: http
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 'uat-kong-gateway:18100'   # container_name:KONG_STATUS_PORT (internal HTTP)
        labels:
          environment: 'uat'
          cluster: 'medasista-kong'
          job: 'kong-gateway'
