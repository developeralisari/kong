scrape_configs:
  - job_name: 'kong'
    metrics_path: /metrics
    scheme: http
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 'uat-kong-gateway:18100'
        labels:
          environment: 'uat'
          cluster: 'medasista-kong'
          job: 'kong-gateway'

  - job_name: 'job-worker'
    metrics_path: /metrics
    scheme: http
    scrape_interval: 30s
    scrape_timeout: 10s
    static_configs:
      - targets:
          - 'uat-job-worker:9090'
        labels:
          environment: 'uat'
          cluster: 'medasista-kong'
          job: 'job-worker'
